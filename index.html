<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ana 💖</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #ffd6e8;
    font-family: "Poppins", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .card {
    background: white;
    width: 330px;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 20px rgba(255, 100, 150, 0.4);
    position: relative;
  }

  h1 {
    color: #ff4d6d;
    font-size: 1.8rem;
    margin-bottom: 10px;
  }

  .emoji {
    font-size: 4rem;
    margin: 10px 0;
  }

  .frase {
    font-size: 1rem;
    color: #444;
    margin-bottom: 20px;
  }

  .botones {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
  }

  .btn {
    padding: 12px 25px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    transition: 0.3s;
  }

  .no {
    background: #1e1e8f;
    color: white;
  }

  .no:hover {
    background: #00006b;
  }

  .si {
    background: #ff4d6d;
    color: white;
    font-weight: bold;
  }

  .si:hover {
    background: #ff1f4a;
  }

  /* Corazones flotando */
  .corazon {
    position: fixed;
    color: rgba(255, 0, 80, 0.7);
    font-size: 22px;
    animation: flotar 6s linear infinite;
  }

  @keyframes flotar {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-800px) scale(1.6); opacity: 0; }
  }
</style>
</head>

<body>

<div class="card">
  <h1>¿Quieres ser mi San Valentín, Ana? 💖</h1>

  <div class="emoji">🐻❤️🐰</div>

  <p class="frase">Dime que sí, porfi… 🥺</p>

  <div class="botones">
    <button class="btn no" onclick="moverNo()">No 💔</button>
    <button class="btn si" onclick="aceptar()">¡Sí! 💖</button>
  </div>
</div>

<script>
  // Corazones flotando
  function crearCorazon() {
    const corazon = document.createElement("div");
    corazon.classList.add("corazon");
    corazon.innerHTML = "❤️";
    corazon.style.left = Math.random() * 100 + "vw";
    corazon.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(corazon);

    setTimeout(() => corazon.remove(), 6000);
  }
  setInterval(crearCorazon, 300);

  // Botón NO se escapa
  function moverNo() {
    const btn = document.querySelector(".no");
    btn.style.position = "relative";
    btn.style.left = (Math.random() * 150 - 75) + "px";
    btn.style.top = (Math.random() * 150 - 75) + "px";
  }

  // Botón SÍ
  function aceptar() {
    document.body.innerHTML = `
      <h1 style="color:#ff1f4a; text-align:center; font-size:2.5rem;">
        💖 Sabía que dirías que sí, Ana 💖
      </h1>
      <p style="text-align:center; font-size:1.3rem; color:#fff;">
        Eres lo mejor que me ha pasado. Te quiero mucho. 💞
      </p>
    `;
  }
</script>

</body>
</html>
